<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VIBORA — Share Your Vibe</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>


    <!-- =====================================
          WELCOME TO VIBORA WELCOME PAGE
    ====================================== -->

    <main class="welcome-page">


        <!-- LOGO -->

        <div class="logo">
            VIBORA
        </div>


        <!-- TAGLINE -->

        <h1>
            Share Your Vibe.<br>
            Tell Your Story.
        </h1>


        <!-- DESCRIPTION -->

        <p class="description">

            Connect with people, share your moments,
            discover new ideas and tell your story
            with the world.

        </p>


        <!-- FEATURES -->

        <div class="features">

            <span>✨ Connect</span>

            <span>•</span>

            <span>✍️ Create</span>

            <span>•</span>

            <span>🌎 Discover</span>

        </div>


        <!-- MAIN BUTTONS -->

        <div class="buttons">

            <button
                class="login-btn"
                onclick="openLogin()"
            >
                🔐 Login 
            </button>


            <button
                class="signup-btn"
                onclick="openSignup()"
            >
                📝 Create Account
            </button>

        </div>


        <!-- DIVIDER -->

        <div class="divider">

            <span></span>

            <p>OR</p>

            <span></span>

        </div>


        <!-- GOOGLE -->

        <button
            class="google-btn"
            onclick="googleLogin()"
        >

            🌐 Continue with Google

        </button>


        <!-- FOOTER -->

        <p class="footer">

            By continuing, you agree to VIBORA's
            <span>Terms</span> and
            <span>Privacy Policy</span>.

        </p>


    </main>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>


        function openLogin() {

    window.location.href = "login.html";

}


        function openSignup() {

    window.location.href = "signup.html";

}


        function googleLogin() {

            alert(
                "Google login will be connected later 🌐"
            );

        }


    </script>


</body>

</html>
